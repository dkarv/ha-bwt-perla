version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Covers requirements_test.txt. The bwt_api version pinned in
  # custom_components/bwt_perla/manifest.json is NOT covered by Dependabot
  # and has to be bumped by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
